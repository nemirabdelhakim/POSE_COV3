name: Build Pose CO V3 APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

env:
  JAVA_VERSION: '21'
  NODE_VERSION: '22'

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Installer Android SDK
        uses: android-actions/setup-android@v3

      - name: Installer la plateforme Android requise
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Installer les dépendances
        run: npm install --no-audit --no-fund

      - name: Préparer le projet Android Capacitor
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi
          node scripts/patch-android.mjs
          npx cap sync android

      - name: Compiler l'APK debug
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: PoseCO-V3-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
